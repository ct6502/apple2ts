name: Deploy Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_DEMOZOO_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:cloudflare

      - name: Verify Cloudflare project setting
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'apple2ts' }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          echo "Deploying Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT"

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'apple2ts' }}
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.118.0 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cloudflare Pages publish failed; retrying in 15 seconds (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          exit 1
