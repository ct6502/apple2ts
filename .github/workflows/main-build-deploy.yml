# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DEMOZOO_ENABLED: ${{ vars.VITE_DEMOZOO_ENABLED || 'false' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        node-version: [24.22.1]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
      with:
        # The apple2gts deploy step below authenticates with its own token, so
        # the checkout must not leave competing credentials in the git config.
        persist-credentials: false
    - name: Setup GitHub Pages
      if: github.event.repository.has_pages
      uses: actions/configure-pages@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # clean install
    - run: node tools/check-node-version.mjs
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: npm run build
    - name: Install GNU gettext
      run: |
        sudo apt-get update
        sudo apt-get install --yes gettext
    - run: npm test
    - name: Upload GitHub Pages artifact
      if: github.event.repository.has_pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist
    - name: Deploy GitHub Pages
      if: github.event.repository.has_pages
      id: deployment
      uses: actions/deploy-pages@v4
    # Second copy of the same build, published from the ct6502/apple2gts
    # repository. That repository runs .github/workflows/deploy-pages.yml on
    # pushes to its gh-pages branch, which is what actually publishes
    # apple2gts.com.
    - name: Point custom domain at apple2gts.com
      run: echo "apple2gts.com" > dist/CNAME
    - name: Deploy to ct6502/apple2gts
      uses: JamesIves/github-pages-deploy-action@v4.7.3
      with:
        token: ${{ secrets.APPLE2GTS_TOKEN }}
        repository-name: ct6502/apple2gts
        branch: gh-pages
        folder: dist
        clean: true
        single-commit: true
        commit-message: Deploy apple2ts ${{ github.sha }}
