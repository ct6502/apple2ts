# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DEMOZOO_ENABLED: ${{ vars.VITE_DEMOZOO_ENABLED || 'false' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        node-version: [24.22.1]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
      with:
        # The apple2gts deploy step below authenticates with its own token, so
        # the checkout must not leave competing credentials in the git config.
        persist-credentials: false
    - name: Setup GitHub Pages
      if: github.event.repository.has_pages
      uses: actions/configure-pages@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # clean install
    - run: node tools/check-node-version.mjs
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - name: Install GNU gettext
      run: |
        sudo apt-get update
        sudo apt-get install --yes gettext
    - run: npm test
    # Build both deployable targets from the same checkout. The scripts set
    # BUILD_TARGET and land in dist/apple2ts and dist/apple2gts respectively.
    - name: Build apple2ts target
      run: npm run build:apple2ts
    - name: Build apple2gts target
      run: npm run build:apple2gts
    - name: Verify deployment domains
      run: |
        test "$(cat dist/apple2ts/CNAME)" = "apple2ts.com"
        test "$(cat dist/apple2gts/CNAME)" = "apple2gts.com"
    - name: Upload GitHub Pages artifact
      if: github.event.repository.has_pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist/apple2ts
    - name: Deploy GitHub Pages
      if: github.event.repository.has_pages
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Detect Apple2GTS token
      id: gts-token
      env:
        APPLE2GTS_TOKEN: ${{ secrets.APPLE2GTS_TOKEN }}
      run: |
        if [ -n "$APPLE2GTS_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
    # Second copy of the same build, published from the ct6502/apple2gts
    # repository. That repository's .github/workflows/deploy-pages.yml reads
    # the gh-pages branch and publishes it; it is started by the dispatch
    # event below, because a push trigger cannot fire from gh-pages (the
    # workflow file would have to exist in the pushed ref).
    - name: Deploy Apple2GTS build
      if: steps.gts-token.outputs.enabled == 'true'
      uses: JamesIves/github-pages-deploy-action@v4.7.3
      with:
        token: ${{ secrets.APPLE2GTS_TOKEN }}
        repository-name: ct6502/apple2gts
        branch: gh-pages
        folder: dist/apple2gts
        clean: true
        single-commit: true
        commit-message: "Deploy Apple2GTS from ${{ github.repository }}"
    - name: Dispatch Apple2GTS Pages deployment
      if: steps.gts-token.outputs.enabled == 'true'
      env:
        APPLE2GTS_TOKEN: ${{ secrets.APPLE2GTS_TOKEN }}
      run: |
        curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer $APPLE2GTS_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/ct6502/apple2gts/dispatches \
          -d '{"event_type":"apple2ts-deploy"}'
