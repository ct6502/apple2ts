# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main, a2ts-proxytest ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-test' }}
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v5
    - name: Configure DemoZoo proxy test build
      if: github.ref == 'refs/heads/a2ts-proxytest'
      run: |
        echo "VITE_DEMOZOO_ENABLED=true" >> "$GITHUB_ENV"
        echo "VITE_DEMOZOO_PROXY_URL=https://apple2ts-proxy.pages.dev" >> "$GITHUB_ENV"
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        npm-version: '>=12'
    # clean install
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: npm run build
    - run: npm test
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: dist
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
